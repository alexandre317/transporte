<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transporte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='34' fill='%2300e5ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<section id="login" class="login hidden">
  <form class="login-card" id="formLogin" autocomplete="on">
    <div class="brand"><i></i> Transporte</div>
    <p>Entre com a sua conta para continuar.</p>
    <div class="grid">
      <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
      <label>Senha<input name="senha" type="password" required maxlength="72" autocomplete="current-password"></label>
      <div id="loginErro" class="err hidden"></div>
      <button class="btn pri" type="submit">Entrar</button>
    </div>
  </form>
</section>

<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="brand"><i></i> Transporte</div>
    <nav class="nav" id="nav"></nav>
    <div class="user">
      <b id="uNome"></b><span id="uPerfil"></span>
      <div style="margin-top:8px"><button class="btn sm" id="btnSair">Sair</button></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn menu-btn" id="btnMenu" aria-label="Menu">☰</button>
        <h1 id="titulo"></h1>
      </div>
      <div id="acoes"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="modal"></div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
