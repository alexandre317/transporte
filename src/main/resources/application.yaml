spring:
  config:
    import: "optional:file:.env[.properties],optional:file:.env.local[.properties]"

  application:
    name: transporte

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  jwt:
    segredo: ${JWT_SEGREDO}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}
  cors:
    origem-permitida: ${ORIGEM_PERMITIDA}
  manutencao:
    alerta-dias: 15
    alerta-km: 1000
  # Primeiro administrador: só é usado quando ainda não existe nenhum. Nada é definido por padrão no código.
  admin:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  dados-demo: ${CARREGAR_DADOS_DEMO:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:false}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:false}

server:
  address: 0.0.0.0
  servlet:
    context-path: /
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
